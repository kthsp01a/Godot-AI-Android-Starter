name: Godot CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required Godot files
        shell: bash
        run: |
          test -f project.godot
          test -f main.tscn
          test -f main.gd
          test -f export_presets.cfg
          grep -q 'run/main_scene="res://main.tscn"' project.godot
          grep -q 'name="Android Debug"' export_presets.cfg
          grep -q 'architectures/arm64-v8a=true' export_presets.cfg
          echo "Static project gate: PASS"
